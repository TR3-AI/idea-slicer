name: render idea maps

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: idea-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render pages from issues
        run: node render.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit and push if changed
        run: |
          git config user.name "idea-slicer bot"
          git config user.email "idea-slicer-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Re-render idea maps from issues" && git push)
